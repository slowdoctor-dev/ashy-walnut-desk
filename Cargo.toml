[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/slowdoctor-dev/ashy-walnut-desk"

[workspace.dependencies]
# Shared dependency versions — pin once, reuse across crates.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
subtle = "2"
hex = "0.4"
base64 = "0.22"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
proptest = "1"
