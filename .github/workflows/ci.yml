name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs let agent sandboxes without hex.pm egress verify a
  # feature branch before opening a PR. Optionally pass migration_name
  # to run Ash codegen instead of the verify gates — the generated
  # migration + snapshots are emitted base64-encoded in the job log so
  # the sandboxed agent can commit byte-exact generator output.
  workflow_dispatch:
    inputs:
      migration_name:
        description: "If set, run mix ash_postgres.generate_migrations --name <this> instead of verify"
        required: false
        default: ""
      screenshots:
        description: "If 'true', boot the dev server and capture the UI screenshot tour as an artifact"
        required: false
        default: ""

jobs:
  codegen:
    name: Codegen (dispatch-only)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.migration_name != ''
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      IDENTIFIER_HASH_SALT: ci-dummy-identifier-hash-salt-not-for-production
      SECRET_KEY_BASE: ci-dummy-secret-key-base-not-for-production-padded-to-meet-minimum-length-aaaaaa
    steps:
      - uses: actions/checkout@v4

      - name: Set up BEAM (Elixir + Erlang/OTP per .tool-versions)
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.1.2"

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Generate migrations + snapshots
        run: mix ash_postgres.generate_migrations --name "${{ github.event.inputs.migration_name }}"

      - name: Extract gettext (picked up by the same tarball)
        run: mix gettext.extract

      - name: Emit generated files (base64 tarball in log)
        run: |
          echo "===CODEGEN-FILES==="
          git status --porcelain priv/
          echo "===CODEGEN-TARBALL-BASE64==="
          git status --porcelain priv/ | awk '{print $NF}' | tar czf - -T - | base64 -w0
          echo ""
          echo "===END-CODEGEN==="

  screenshots:
    name: Screenshots (dispatch-only)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.screenshots == 'true'
    runs-on: ubuntu-24.04

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ashy_walnut_desk_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up BEAM (Elixir + Erlang/OTP per .tool-versions)
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.1.2"

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Prepare dev database
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Build assets (tailwind + esbuild)
        run: |
          mix assets.setup
          mix assets.build

      - name: Install Playwright + Chromium
        run: |
          python3 -m pip install --user playwright \
            || python3 -m pip install --user --break-system-packages playwright
          python3 -m playwright install --with-deps chromium

      - name: Boot dev server
        run: |
          nohup mix phx.server > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sSf -o /dev/null -m 2 http://localhost:4000 && break
            sleep 2
          done
          curl -sSf -o /dev/null -m 5 http://localhost:4000 || (cat server.log; exit 1)

      - name: Capture screenshot tours (phases 1-3 committed; 4/5 here)
        run: bash scripts/screenshots-phase5.sh

      - name: Server log tail (diagnostics)
        if: always()
        run: tail -80 server.log || true

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase5-screenshots
          path: docs/phase-5-screenshots/
          if-no-files-found: error

  verify:
    name: Verify
    if: github.event_name != 'workflow_dispatch' || (github.event.inputs.migration_name == '' && github.event.inputs.screenshots != 'true')
    runs-on: ubuntu-24.04

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ashy_walnut_desk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Dummy CI values — never used in production. Real deployments
      # configure these via the operator's secret store.
      MIX_ENV: test
      IDENTIFIER_HASH_SALT: ci-dummy-identifier-hash-salt-not-for-production
      SECRET_KEY_BASE: ci-dummy-secret-key-base-not-for-production-padded-to-meet-minimum-length-aaaaaa

    steps:
      - uses: actions/checkout@v4

      - name: Set up BEAM (Elixir + Erlang/OTP per .tool-versions)
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.1.2"

      - name: Install Mix dependencies
        run: mix deps.get

      # ─── Verification gates (architecture.md §11) ───────────────────

      - name: Gate 1 — mix format --check-formatted
        run: mix format --check-formatted

      - name: Gate 2 — mix credo --strict
        run: mix credo --strict

      - name: Gate 3 — mix ash_postgres.generate_migrations --check
        run: mix ash_postgres.generate_migrations --check

      - name: Gate 3b — gettext .po files match source
        run: |
          mix gettext.extract
          git diff --exit-code priv/gettext/ \
            || (echo "✗ gettext drift — run 'mix gettext.extract' locally and commit"; exit 1)

      - name: Prepare test database
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Gate 4 — mix test
        run: mix test

      - name: Gate 5 — scripts/spec-check.sh
        run: bash scripts/spec-check.sh
